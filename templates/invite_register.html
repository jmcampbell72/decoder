{% extends "base.html" %}

{% block title %}Join {{ company.name }} - {{ brand.name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <!-- Company invite banner -->
            <div class="card border-0 shadow-sm mb-4 bg-primary bg-opacity-10">
                <div class="card-body text-center py-4">
                    <div class="mb-3">
                        <span class="bg-primary rounded-circle d-inline-flex align-items-center justify-content-center"
                              style="width:56px;height:56px;">
                            <i class="fas fa-users fa-xl text-white"></i>
                        </span>
                    </div>
                    <h5 class="mb-1">You've been invited!</h5>
                    <p class="text-muted mb-0">
                        Create your account to join <strong>{{ company.name }}</strong>
                    </p>
                </div>
            </div>

            <!-- Registration card -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h4 class="text-center mb-4">
                        <i class="fas fa-user-plus me-2"></i>Create Your Account
                    </h4>

                    <form method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control" id="username" name="username"
                                       placeholder="Choose a username" required minlength="3">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email"
                                       value="{{ invite.invited_email or '' }}"
                                       placeholder="your@email.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="At least 6 characters" required minlength="6">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                                       placeholder="Repeat your password" required minlength="6">
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-user-check me-2"></i>Join {{ company.name }}
                            </button>
                        </div>
                    </form>

                    <div class="text-center">
                        <small class="text-muted">
                            Already have an account?
                            <a href="{{ url_for('auth.login') }}">Log in</a>
                        </small>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
